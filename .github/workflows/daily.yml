name: daily-vinted-deals

on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC (off-the-hour to avoid congestion)
  workflow_dispatch: {}     # allow manual runs
  # A push that changes *what gets scraped or how it's judged* re-scrapes, so
  # the effect is visible immediately rather than the next morning. Changes to
  # the page itself are handled by publish-site.yml, which doesn't scrape.
  push:
    branches: [main]
    paths:
      - 'src/vinted/**'
      - 'src/pricing/**'
      - 'src/storage/**'
      - 'src/filters.py'
      - 'src/config.py'
      - 'src/run.py'
      - 'config/**'
      - '.github/workflows/daily.yml'
      - 'requirements.txt'

permissions:
  contents: write           # commit the updated DB
  pages: write              # the publish job below deploys the site
  id-token: write

concurrency:
  group: daily-vinted-deals
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Read-only: the daily job merges the poller's alert log into the
      # committed DB so alert dedup survives the cache being evicted.
      - name: Restore poller state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hot.db
            data/hot.db-wal
            data/hot.db-shm
          key: hot-state-
          restore-keys: |
            hot-state-

      - name: Scrape and build site
        id: run
        env:
          # Optional residential proxy if GitHub's shared IPs get blocked.
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python -m src.run
        continue-on-error: true

      - name: Commit data
        if: steps.run.outcome == 'success'
        run: |
          git config user.name "deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily deals update $(date -u +%F)"
            git push
          fi

      # Fails the job, which skips the publish below. That's intended: a failed
      # scrape leaves the DB untouched, so there is nothing new to deploy.
      - name: Surface scrape failure
        if: steps.run.outcome != 'success'
        run: |
          echo "::error::Scrape failed or returned no items — DB left untouched."
          exit 1

  # Deploy the site from the commit the scrape just pushed. Reuses
  # publish-site.yml so the deploy mechanism lives in exactly one place.
  publish:
    needs: scrape
    uses: ./.github/workflows/publish-site.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
