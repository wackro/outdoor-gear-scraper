# Vinted UK outdoor-gear bargain scraper — configuration.
# Copy config/config.example.yaml to config/config.yaml and adjust.

currency: GBP
base_url: https://www.vinted.co.uk

scrape:
  per_page: 96
  order: newest_first
  max_pages_per_query: 3    # one query per category (all brands combined), so a few pages is cheap
  min_delay_sec: 2.5
  max_delay_sec: 5.0
  impersonate: chrome
  max_retries: 3

deals:
  threshold: 0.30           # flag when price <= median * (1 - threshold)
  min_samples: 8
  window_days: 90
  stale_days: 5

quality:
  floor: Good               # hide anything below this condition

# Allowed sizes per gender + garment type. Bags have no size (unrestricted).
sizes:
  men:
    clothes:  [M, L]
    trousers: [30, 32]
    shoes:    [8.5, 9]
  women:
    clothes:  [XS, S, 6, 8]
    trousers: [8, 10]
    shoes:    [5]

# Categories to scrape, resolved to catalog ids by name within their gender
# department. `type: bags` items appear in a unisex "Bags" tab and skip size
# filtering. (ids are fallbacks if resolution ever fails.)
categories:
  - {gender: men,   type: clothes,  search: "Jackets",              id: 2052}
  - {gender: men,   type: clothes,  search: "Tops & t-shirts",      id: 76}
  - {gender: men,   type: clothes,  search: "Jumpers & sweaters",   id: 79}
  - {gender: men,   type: trousers, search: "Trousers",             id: 34}
  - {gender: men,   type: trousers, search: "Jeans",                id: 257}
  - {gender: men,   type: shoes,    search: "Shoes",                id: 1231}
  - {gender: men,   type: bags,     search: "Backpacks",            id: 246}
  - {gender: women, type: clothes,  search: "Jackets",              id: 1908}
  - {gender: women, type: clothes,  search: "Tops & t-shirts",      id: 12}
  - {gender: women, type: clothes,  search: "Jumpers & hoodies",    id: 1917}
  - {gender: women, type: trousers, search: "Trousers, shorts & dungarees", id: 573}
  - {gender: women, type: trousers, search: "Jeans",                id: 183}
  - {gender: women, type: shoes,    search: "Shoes",                id: 16}
  - {gender: women, type: bags,     search: "Backpacks",            id: 157}

