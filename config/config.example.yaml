# Vinted UK outdoor-gear bargain scraper — configuration.
# Copy config/config.example.yaml to config/config.yaml and adjust.

currency: GBP
base_url: https://www.vinted.co.uk

scrape:
  per_page: 96
  order: newest_first
  max_pages_per_query: 1    # 96 newest per brand+category per day is plenty
  min_delay_sec: 2.5
  max_delay_sec: 5.0
  impersonate: chrome
  max_retries: 3

deals:
  threshold: 0.30           # flag when price <= median * (1 - threshold)
  min_samples: 8
  window_days: 90
  stale_days: 5

# Minimum acceptable condition. Items below this are hidden. One of:
# "New with tags" > "New without tags" > "Very good" > "Good" > "Satisfactory".
quality:
  floor: Good

# Allowed sizes per gender + garment type. Anything outside these is hidden.
# Matching is strict and type-aware (shoes read the UK number, trousers read the
# waist, clothes read the letter/number size).
sizes:
  men:
    clothes:  [M, L]
    trousers: [30, 32]      # waist
    shoes:    [8.5, 9]      # UK
  women:
    clothes:  [XS, S, 6, 8]
    trousers: [8, 10]       # waist / UK
    shoes:    [5]           # UK

# Categories to scrape. Each is resolved to a Vinted catalog id by name within
# its gender department (ids below are fallbacks if resolution ever fails).
#   gender: men | women     type: clothes | trousers | shoes
categories:
  - {gender: men,   type: clothes,  search: "Jackets",              id: 2052}
  - {gender: men,   type: clothes,  search: "Tops & t-shirts",      id: 76}
  - {gender: men,   type: clothes,  search: "Jumpers & sweaters",   id: 79}
  - {gender: men,   type: trousers, search: "Trousers",             id: 34}
  - {gender: men,   type: trousers, search: "Jeans",                id: 257}
  - {gender: men,   type: shoes,    search: "Shoes",                id: 1231}
  - {gender: women, type: clothes,  search: "Jackets",              id: 1649}
  - {gender: women, type: clothes,  search: "Tops & t-shirts",      id: 1198}
  - {gender: women, type: clothes,  search: "Jumpers & hoodies",    id: 1199}
  - {gender: women, type: trousers, search: "Trousers, shorts & dungarees", id: 1200}
  - {gender: women, type: trousers, search: "Jeans",                id: 1696}
  - {gender: women, type: shoes,    search: "Shoes",                id: 1256}

# Brands to watch (resolved by name; see README).
brands:
  arcteryx:
    search: "Arc'teryx"
    threshold: 0.35
  patagonia:
  rab:
  montane:
  the_north_face:
    id: 2319
  fjallraven:
    search: "Fjällräven"
  mammut:
  berghaus:
  haglofs:
    search: "Haglöfs"
