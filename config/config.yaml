# Vinted UK outdoor-gear bargain scraper — configuration.
# Copy config/config.example.yaml to config/config.yaml and adjust.

currency: GBP
base_url: https://www.vinted.co.uk

scrape:
  per_page: 96
  order: newest_first
  max_pages_per_query: 3    # one query per category (all brands combined), so a few pages is cheap
  min_delay_sec: 2.5
  max_delay_sec: 5.0
  impersonate: chrome
  max_retries: 3

deals:
  threshold: 0.30           # flag when price <= median * (1 - threshold)
  min_samples: 8
  window_days: 90            # observations older than this stop feeding baselines
  stale_days: 5              # unseen for this long -> marked inactive
  prune_items_days: 7        # ...and this long -> deleted outright. The only
                             # thing bounding the DB file, which is committed to
                             # git and hard-fails above 100 MB. Observations
                             # survive, so baselines are unaffected; alerted
                             # listings are never pruned.

quality:
  floor: Good               # hide anything below this condition

# Allowed sizes per gender + garment type. Bags have no size (unrestricted).
sizes:
  men:
    clothes:  [M, L]
    trousers: [30, 32]
    shoes:    [8.5, 9]
  # Unused while there are no women's categories configured. Kept so the rules
  # are intact if any are added back.
  women:
    clothes:  [XS, S, 6, 8]
    trousers: [8, 10]
    shoes:    [5]

# --- fast poller -----------------------------------------------------------
# Pacing for `python -m src.hot.poller`. Each cycle sweeps a rotating slice of
# categories, so every category is revisited every few minutes — which is also
# the interval a favourite-count delta needs in order to be measurable.
poll:
  interval_sec: 120          # seconds between cycles
  deep_pages: 6              # categories swept per cycle. 6 of 17 at a 120s
                             # cycle means every category is revisited every
                             # ~5.7 min, which is also the worst case for how old
                             # a listing can be when we first see it. Costs
                             # 3 requests/min (~4,320/day).
  jitter: 0.2                # +/- fraction, so requests aren't a metronome
  session_refresh_min: 30    # re-bootstrap Vinted cookies this often
  threshold_refresh_sec: 600
  max_runtime_sec: 20700     # 5h45m — exit cleanly before the 6h Actions limit
  cooldown_base_sec: 60      # backoff after a 429/403, doubling each time
  cooldown_max_sec: 900
  circuit_breaker_failures: 8
  night:                     # UK listing volume collapses overnight
    start_hour: 1            # UTC
    end_hour: 6
    multiplier: 4

  # The website's live data. Published to a force-pushed single-commit branch so
  # the repo gains no history, however long the poller runs.
  feed_enabled: true
  feed_branch: hot-feed
  feed_publish_interval_sec: 300
  feed_limit: 120

# --- website --------------------------------------------------------------
site:
  # Pinned, not derived. Deriving it from $GITHUB_REPOSITORY meant the URL
  # depended on *where* the page was rendered: a render outside Actions fell
  # back to the relative "hot.json", which resolves to the empty build-time
  # fallback sitting next to the page rather than the live feed -- a page that
  # looks fine and is silently, permanently empty.
  feed_url: "https://raw.githubusercontent.com/wackro/outdoor-gear-scraper/hot-feed/hot.json"
  refresh_sec: 60

# --- instant alerts --------------------------------------------------------
# Hotness is the trigger; price is only a veto. See src/hot/alerts.py.
alerts:
  enabled: true
  # Soft launch: the poller runs for real -- polling, scoring, detecting sales
  # and publishing the site feed -- but writes alerts to the Actions log instead
  # of pushing them. TO GO LIVE ON YOUR PHONE: set ntfy_topic below to something
  # unguessable, then change this to `ntfy`. Nothing else needs touching.
  channel: console           # ntfy | console
  ntfy_topic: ""             # required once channel is `ntfy`; it is public
  ntfy_server: https://ntfy.sh
  burst_cap_per_hour: 10     # hard ceiling, so a bug can't send 500 pushes

  # What counts as hot. The bar is the higher of the floor and a percentile of
  # what listings are currently achieving, so it adapts without retuning.
  velocity_window_min: 30
  floor_favourites_per_hour: 4
  min_favourites_gain: 3     # raw likes needed — one like over a short span
                             # implies a huge hourly rate, so rates alone aren't enough
  percentile: 99
  min_population: 200        # below this, the floor alone decides
  fav_weight: 0.7            # likes: strong intent, arrive later
  view_weight: 0.3           # views: weaker signal, but arrive earlier

  # Which listings are eligible at all.
  min_age_minutes: 3         # younger than this and the rate maths is meaningless
  max_age_minutes: 180       # older than this and the window has closed
  population_max_age_min: 60
  allow_bootstrap: false     # act on single-sighting estimates? main false-alarm source

  # Price veto — never the trigger, only a way to reject "popular at a fair price".
  sanity_discount: 0.10
  max_price: 400

# Categories to watch, identified by Vinted catalog id.
#
# By id, not by title: the men's tree has genuine duplicate titles -- "Outerwear"
# is both 1206 and 581, "Shorts" is both 80 and 586 -- so a title lookup can
# silently bind to the wrong node. `python -m scripts.list_categories` dumps the
# full tree with ids.
#
# `name` is the database key, not a display name. It appears in items.category,
# deals.category and baselines.category, so renaming one orphans that category's
# accumulated price history. The Vinted title is in the trailing comment.
categories:
  - {id: 2052, gender: men, type: clothes,  name: men_jackets             }  # Jackets
  - {id:   79, gender: men, type: clothes,  name: men_jumpers_&_sweaters  }  # Jumpers & sweaters
  - {id:   34, gender: men, type: trousers, name: men_trousers            }  # Trousers
  - {id: 1231, gender: men, type: shoes,    name: men_shoes               }  # Shoes
  - {id:   94, gender: men, type: bags,     name: men_bags_&_backpacks    }  # Bags & backpacks
  - {id: 1858, gender: men, type: clothes,  name: men_fleece_jackets      }  # Fleece jackets
  - {id: 2536, gender: men, type: clothes,  name: men_puffer_jackets      }  # Puffer jackets
  - {id: 1859, gender: men, type: clothes,  name: men_raincoats           }  # Raincoats
  - {id: 2551, gender: men, type: clothes,  name: men_windbreakers        }  # Windbreakers
  - {id: 2553, gender: men, type: clothes,  name: men_gilets              }  # Gilets & body warmers
  - {id: 2539, gender: men, type: clothes,  name: men_ski_jackets         }  # Ski & snowboard jackets
  - {id:  267, gender: men, type: clothes,  name: men_hoodies             }  # Hoodies & sweaters
  - {id:  585, gender: men, type: clothes,  name: men_pullovers           }  # Pullovers & sweaters
  - {id: 2678, gender: men, type: shoes,    name: men_hiking_boots        }  # Hiking boots & shoes
  - {id: 1453, gender: men, type: shoes,    name: men_running_shoes       }  # Running shoes
  - {id: 2673, gender: men, type: shoes,    name: men_climbing_shoes      }  # Climbing & bouldering shoes
  - {id:  246, gender: men, type: bags,     name: men_backpacks           }  # Backpacks

